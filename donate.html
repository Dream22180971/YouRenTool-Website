<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支持游刃 - 请开发者喝杯咖啡</title>
<meta name="description" content="如果游刃对您有帮助，欢迎打赏支持开发者继续维护！">
<style>
:root {
--primary: #165dff;
--primary-hover: #4080ff;
--bg: #f8f9fa;
--surface: #ffffff;
--text: #1d2129;
--text-secondary: #4e5969;
--text-muted: #86909c;
--border: #e5e6eb;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
background: var(--bg);
color: var(--text);
line-height: 1.6;
min-height: 100vh;
display: flex;
flex-direction: column;
}

/* 导航栏 */
.navbar {
position: fixed;
top: 0;
left: 0;
right: 0;
background: rgba(255, 255, 255, 0.95);
backdrop-filter: blur(10px);
border-bottom: 1px solid var(--border);
z-index: 1000;
padding: 0 24px;
}

.nav-container {
max-width: 1200px;
margin: 0 auto;
display: flex;
align-items: center;
justify-content: space-between;
height: 64px;
}

.nav-logo {
font-size: 20px;
font-weight: 700;
color: var(--primary);
text-decoration: none;
}

.nav-links {
display: flex;
gap: 32px;
}

.nav-links a {
color: var(--text-secondary);
text-decoration: none;
font-size: 15px;
transition: color 0.2s;
}

.nav-links a:hover {
color: var(--primary);
}

/* 主内容 */
main {
flex: 1;
padding: 100px 24px 60px;
display: flex;
justify-content: center;
align-items: flex-start;
}

.donate-card {
background: var(--surface);
border-radius: 20px;
box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
max-width: 520px;
width: 100%;
overflow: hidden;
margin-top: 40px;
}

.donate-header {
background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
padding: 48px 40px;
text-align: center;
color: #fff;
}

.donate-header h1 {
font-size: 32px;
margin-bottom: 12px;
}

.donate-header p {
font-size: 16px;
opacity: 0.9;
}

.donate-content {
padding: 40px;
}

.qr-section {
display: flex;
justify-content: center;
gap: 48px;
margin: 32px 0;
}

.qr-item {
text-align: center;
}

.qr-item img {
width: 200px;
height: 200px;
border-radius: 16px;
border: 3px solid var(--border);
box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
transition: transform 0.3s ease;
}

.qr-item img:hover {
transform: scale(1.05);
}

.qr-label {
display: block;
margin-top: 16px;
font-weight: 600;
font-size: 18px;
color: var(--text);
}

.qr-desc {
display: block;
font-size: 14px;
color: var(--text-muted);
margin-top: 4px;
}

.message {
background: var(--bg);
border-radius: 12px;
padding: 24px;
text-align: center;
color: var(--text-secondary);
font-size: 15px;
line-height: 1.8;
margin-top: 32px;
}

.message strong {
color: var(--text);
}

.back-link {
display: inline-flex;
align-items: center;
gap: 8px;
margin-top: 32px;
padding: 14px 28px;
background: var(--primary);
color: #fff;
border-radius: 12px;
text-decoration: none;
font-weight: 600;
font-size: 16px;
transition: all 0.3s ease;
}

.back-link:hover {
background: var(--primary-hover);
transform: translateY(-2px);
box-shadow: 0 4px 16px rgba(22, 93, 255, 0.3);
}

/* 页脚 */
.footer {
background: var(--surface);
border-top: 1px solid var(--border);
padding: 24px;
text-align: center;
}

.footer p {
color: var(--text-muted);
font-size: 14px;
}

.footer a {
color: var(--primary);
text-decoration: none;
}

.footer a:hover {
text-decoration: underline;
}

/* 响应式 */
@media (max-width: 560px) {
.qr-section {
flex-direction: column;
align-items: center;
gap: 32px;
}

.qr-item img {
width: 220px;
height: 220px;
}

.donate-header {
padding: 36px 24px;
}

.donate-content {
padding: 28px 24px;
}
}
</style>
</head>
<body>
<nav class="navbar">
<div class="nav-container">
<a href="/" class="nav-logo">🛡️ 游刃</a>
<div class="nav-links">
<a href="/">首页</a>
<a href="/donate.html">支持我们</a>
<a href="/privacy.html">隐私政策</a>
</div>
</div>
</nav>

<main>
<div class="donate-card">
<div class="donate-header">
<h1>☕ 请开发者喝杯咖啡</h1>
<p>感谢您使用游刃密码管理器</p>
</div>
<div class="donate-content">
<div class="qr-section">
<div class="qr-item">
<img src="assets/alipay1.png" alt="支付宝收款码">
<span class="qr-label">支付宝</span>
<span class="qr-desc">扫码支付</span>
</div>
<div class="qr-item">
<img src="assets/wechat.png1.png" alt="微信收款码">
<span class="qr-label">微信</span>
<span class="qr-desc">扫码支付</span>
</div>
</div>
<div class="message">
<strong>您的支持是我持续维护的动力！</strong><br>
每一笔打赏都会让我更有动力优化功能、修复Bug。<br>
如果您觉得游刃好用，欢迎推荐给身边的朋友。
</div>
<div style="text-align:center">
<a href="/" class="back-link">← 返回游刃官网</a>
</div>
</div>
</div>
</main>

<footer class="footer">
<p>© 2024 游刃 · <a href="/">官网</a> · <a href="/privacy.html">隐私政策</a></p>
</footer>
</body>
</html>
